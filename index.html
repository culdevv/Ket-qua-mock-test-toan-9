<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu kết quả thi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <section class="search-card" id="searchSection">
        <div class="logo">🎓</div>
        <h1>TRA CỨU KẾT QUẢ THI</h1>
        <p class="subtitle">Vui lòng nhập mã số học sinh để xem kết quả</p>

        <div class="input-group">
            <label for="studentId">Mã số học sinh</label>
            <input type="text" id="studentId" placeholder="Ví dụ: 20233513" autocomplete="off">
        </div>

        <button id="searchButton">XEM KẾT QUẢ</button>
        <p class="error-message" id="errorMessage"></p>
    </section>

    <section class="result-card hidden" id="resultSection">
        <div class="result-header">
            <div class="logo">🎓</div>
            <h1>KẾT QUẢ THI</h1>
        </div>

        <div class="student-info">
            <div class="info-row">
                <span>Họ và tên</span>
                <strong id="studentName"></strong>
            </div>
            <div class="info-row">
                <span>Mã số học sinh</span>
                <strong id="resultStudentId"></strong>
            </div>
        </div>

        <div class="score-section">
            <h2>📊 Kết quả</h2>
            <div class="score-row">
                <span>Điểm số</span>
                <strong id="studentScore"></strong>
            </div>
            <div class="score-row">
                <span>Xếp loại</span>
                <strong id="studentRank"></strong>
            </div>
        </div>

        <div class="comment-section">
            <h2>💬 Nhận xét của giáo viên</h2>
            <p id="teacherComment"></p>
        </div>

        <button class="back-button" id="backButton">← TRA CỨU LẠI</button>
    </section>

</main>

<footer>
    <p>© 2026 - Hệ thống tra cứu kết quả thi</p>
</footer>

<script src="script.js"></script>
</body>
</html>
